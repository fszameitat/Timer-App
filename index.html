<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kunden-Timer</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --accent: #2563eb; --run: #16a34a; --run-bg: #e8f7ee; --danger: #dc2626; --border: #e2e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1e232b; --text: #e8eaee; --muted: #9aa3b2;
      --accent: #4f8bff; --run: #34d399; --run-bg: #173127; --danger: #f87171; --border: #2c323c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input { flex: 1; padding: 12px; font-size: 1rem; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); min-width: 0; }
  button { font: inherit; cursor: pointer; border: none; border-radius: 10px; }
  .add { background: var(--accent); color: #fff; padding: 0 18px; font-weight: 600; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .timer { display: flex; align-items: center; gap: 8px; background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 6px 6px 6px 0; }
  .timer.running { border-color: var(--run); background: var(--run-bg); }
  .main-btn { flex: 1; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: none; color: var(--text); text-align: left; padding: 14px 16px; min-width: 0; }
  .name { font-weight: 600; font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { display: block; font-size: .8rem; color: var(--muted); font-weight: 400; }
  .running .state { color: var(--run); font-weight: 600; }
  .time { font-variant-numeric: tabular-nums; font-size: 1.3rem; font-weight: 700; white-space: nowrap; }
  .icon { background: none; color: var(--muted); padding: 10px; font-size: 1.1rem; border-radius: 8px; }
  .icon:hover { background: var(--border); color: var(--text); }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); color: var(--muted); flex-wrap: wrap; gap: 10px; }
  .footer strong { color: var(--text); font-variant-numeric: tabular-nums; }
  .link { background: none; color: var(--accent); padding: 6px 8px; }
</style>
</head>
<body>
<main>
  <h1>Kunden-Timer</h1>
  <p class="sub">Auf einen Kunden tippen = Start. Nochmal tippen = Stopp. Die Zeit läuft beim nächsten Start einfach weiter.</p>

  <form id="addForm">
    <input id="nameInput" type="text" placeholder="Neuer Kunde / Timer-Name" autocomplete="off" required>
    <button class="add" type="submit">Anlegen</button>
  </form>

  <div class="list" id="list"></div>

  <div class="footer">
    <span>Gesamt: <strong id="total">0:00:00</strong></span>
    <span>
      <button class="link" id="exportBtn">CSV exportieren</button>
    </span>
  </div>
</main>

<script>
  const KEY = "kunden-timer-v1";
  let timers = load();

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(timers)); } catch {}
  }
  function elapsed(t) {
    return t.total + (t.runningSince ? Date.now() - t.runningSince : 0);
  }
  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    return `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  }
  function stop(t) {
    if (t.runningSince) { t.total += Date.now() - t.runningSince; t.runningSince = null; }
  }

  function toggle(id) {
    const t = timers.find(x => x.id === id);
    if (t.runningSince) {
      stop(t);
    } else {
      timers.forEach(stop);            // immer nur ein Timer gleichzeitig
      t.runningSince = Date.now();
    }
    save(); render();
  }
  function rename(id) {
    const t = timers.find(x => x.id === id);
    const n = prompt("Neuer Name:", t.name);
    if (n && n.trim()) { t.name = n.trim(); save(); render(); }
  }
  function edit(id) {
    const t = timers.find(x => x.id === id);
    stop(t);
    const v = prompt(`Zeit für „${t.name}" korrigieren (Format h:mm:ss) — oder 0 zum Zurücksetzen:`, fmt(t.total));
    if (v === null) { save(); render(); return; }
    const p = v.trim().split(":").map(Number);
    if (p.some(isNaN)) { alert("Ungültiges Format."); return; }
    while (p.length < 3) p.unshift(0);
    t.total = ((p[0] * 3600) + (p[1] * 60) + p[2]) * 1000;
    save(); render();
  }
  function remove(id) {
    const t = timers.find(x => x.id === id);
    if (confirm(`„${t.name}" wirklich löschen? Die erfasste Zeit (${fmt(elapsed(t))}) geht verloren.`)) {
      timers = timers.filter(x => x.id !== id); save(); render();
    }
  }

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    if (!timers.length) {
      list.innerHTML = '<div class="empty">Noch keine Timer. Leg oben deinen ersten Kunden an.</div>';
    }
    timers.forEach(t => {
      const row = document.createElement("div");
      row.className = "timer" + (t.runningSince ? " running" : "");
      row.innerHTML = `
        <button class="main-btn" title="Start / Stopp">
          <span style="min-width:0"><span class="name"></span><span class="state">${t.runningSince ? "● läuft" : "gestoppt"}</span></span>
          <span class="time" data-id="${t.id}">${fmt(elapsed(t))}</span>
        </button>
        <button class="icon" data-a="rename" title="Umbenennen">✎</button>
        <button class="icon" data-a="edit" title="Zeit korrigieren">⏱</button>
        <button class="icon" data-a="remove" title="Löschen">✕</button>`;
      row.querySelector(".name").textContent = t.name;
      row.querySelector(".main-btn").onclick = () => toggle(t.id);
      row.querySelector('[data-a="rename"]').onclick = () => rename(t.id);
      row.querySelector('[data-a="edit"]').onclick = () => edit(t.id);
      row.querySelector('[data-a="remove"]').onclick = () => remove(t.id);
      list.appendChild(row);
    });
    tick();
  }

  function tick() {
    document.querySelectorAll(".time[data-id]").forEach(el => {
      const t = timers.find(x => x.id === el.dataset.id);
      if (t) el.textContent = fmt(elapsed(t));
    });
    document.getElementById("total").textContent = fmt(timers.reduce((s, t) => s + elapsed(t), 0));
    const running = timers.find(t => t.runningSince);
    document.title = running ? `▶ ${fmt(elapsed(running))} – ${running.name}` : "Kunden-Timer";
  }

  document.getElementById("addForm").onsubmit = e => {
    e.preventDefault();
    const inp = document.getElementById("nameInput");
    const name = inp.value.trim();
    if (!name) return;
    timers.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, total: 0, runningSince: null });
    inp.value = "";
    save(); render();
  };

  document.getElementById("exportBtn").onclick = () => {
    const rows = [["Kunde", "Zeit (h:mm:ss)", "Stunden (dezimal)"]];
    timers.forEach(t => {
      const ms = elapsed(t);
      rows.push([t.name, fmt(ms), (ms / 3600000).toFixed(2).replace(".", ",")]);
    });
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(";")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv" }));
    a.download = `kunden-timer-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
  };

  setInterval(tick, 1000);
  render();
</script>
</body>
</html>
